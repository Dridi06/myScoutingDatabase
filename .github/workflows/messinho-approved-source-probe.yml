name: MESSINHO approved source probe
on:
  push:
    branches:
      - feature/messinho-unified-ai-integration
    paths:
      - '.github/workflows/messinho-approved-source-probe.yml'
      - 'backend/messinho-approved-source-ingestion.js'
      - 'backend/messinho-rights-registry.js'
  workflow_dispatch:
jobs:
  source-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run real approved-source ingestion against publishers
        run: |
          node --input-type=module <<'NODE'
          import { fetchMessinhoApprovedSource } from './backend/messinho-approved-source-ingestion.js';
          const sources = [
            ['plos_one_vo2max_prediction_2023', 'VO2max maximal oxygen uptake cardiorespiratory fitness'],
            ['pmc_cardiorespiratory_fitness_2022', 'cardiorespiratory fitness maximal oxygen uptake']
          ];
          let failed = false;
          for (const [source_id, topic] of sources) {
            const result = await fetchMessinhoApprovedSource(source_id, { topic });
            const summary = {
              source_id,
              status: result.status,
              excerpt_count: result.excerpts?.length || 0,
              sections: [...new Set((result.excerpts || []).map(item => item.source_section))],
              publisher_host: result.source ? new URL(result.source.url).hostname : null,
              storage_policy: result.storage_policy || null
            };
            console.log(JSON.stringify(summary));
            if (result.status !== 'completed' || !result.excerpts?.length) failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE
