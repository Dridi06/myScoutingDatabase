name: MESSINHO staging branch CI

on:
  push:
    branches:
      - feature/messinho-unified-ai-integration
      - feature/messinho-conversational-intelligence-2
      - feature/messinho-autonomous-agent-semantic-planner
  pull_request:
    branches:
      - main
      - feature/messinho-unified-ai-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messinho-staging-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, backend syntax and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression suite, backend syntax checks and Vite build
        run: npm run build
