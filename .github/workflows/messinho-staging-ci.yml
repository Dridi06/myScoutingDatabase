name: MESSINHO staging branch CI

on:
  push:
    branches:
      - feature/messinho-unified-ai-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messinho-staging-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, backend syntax and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression suite, backend syntax checks and Vite build
        run: npm run build

      - name: Probe approved MESSINHO foundation sources
        run: |
          node --input-type=module <<'NODE'
          const sources = [
            { id: 'plos_one_vo2max_prediction_2023', url: 'https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0280897&type=manuscript', accept: 'application/xml,text/xml;q=0.9', kind: 'xml' },
            { id: 'pmc_cardiorespiratory_fitness_2022', url: 'https://www.ncbi.nlm.nih.gov/research/bionlp/RESTful/pmcoa.cgi/BioC_json/PMC11269081/unicode', accept: 'application/json', kind: 'json' }
          ];
          let failed = false;
          for (const source of sources) {
            try {
              const response = await fetch(source.url, { headers: { accept: source.accept, 'user-agent': 'MESSINHO-approved-source-probe/1.0' }, redirect: 'manual', signal: AbortSignal.timeout(20000) });
              const body = await response.text();
              let detail = {};
              if (source.kind === 'xml') {
                detail = { bytes: Buffer.byteLength(body), abstract_count: (body.match(/<abstract\\b/gi) || []).length, paragraph_count: (body.match(/<p\\b/gi) || []).length, has_vo2max: /vo.?2.?max|oxygen uptake/i.test(body) };
              } else {
                let parsed;
                try { parsed = JSON.parse(body); } catch {}
                const docs = Array.isArray(parsed?.documents) ? parsed.documents : Array.isArray(parsed?.collection?.documents) ? parsed.collection.documents : [];
                const passages = docs.flatMap(doc => Array.isArray(doc?.passages) ? doc.passages : []);
                detail = { bytes: Buffer.byteLength(body), json_valid: !!parsed, document_count: docs.length, passage_count: passages.length, has_vo2max: /oxygen uptake|maximal oxygen/i.test(passages.map(p => p.text || '').join(' ')) };
              }
              console.log(JSON.stringify({ id: source.id, status: response.status, ok: response.ok, redirected: response.status >= 300 && response.status < 400, content_type: response.headers.get('content-type'), final_url: response.url, ...detail }));
              if (!response.ok || (source.kind === 'xml' ? !detail.paragraph_count : !detail.json_valid || !detail.passage_count)) failed = true;
            } catch (error) {
              console.log(JSON.stringify({ id: source.id, error: error.name + ': ' + error.message }));
              failed = true;
            }
          }
          if (failed) process.exitCode = 1;
          NODE
