name: MESSINHO Node tests
on:
  push:
    branches:
      - main
      - fix/messinho-runtime-coverage
      - feature/messinho-unified-ai-integration
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Check backend JavaScript syntax
        run: find backend -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
