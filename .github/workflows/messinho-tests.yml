name: MESSINHO Node tests
on:
  push:
    branches:
      - main
      - fix/messinho-runtime-coverage
      - feature/messinho-live-data-context
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
